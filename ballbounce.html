<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>
    <div id="wrapper">
      <canvas id="field" width="500" height="300"></canvas>
      <div class="controls">
        <button id="add-button" class="control-button">Add Ball</button>
        <button id="remove-button" class="control-button">Remove Ball</button>
        <button id="pause-button" class="control-button">Pause</button>
        <button id="clear-button" class="control-button">Clear</button>
        <button id="gravity-button" class="control-button">
          Toggle Gravity
        </button>
        <div class="inputs">
          <div class="control-input-wrapper input-number">
            <span class="input-label">Canvas Width</span
            ><input id="canvas-width" type="number" value="500" />
          </div>
          <div class="control-input-wrapper input-number">
            <span class="input-label">Canvas Height</span
            ><input id="canvas-height" type="number" value="300" />
          </div>
        </div>
      </div>
    </div>
    <script src="./scripts/script.js"></script>
  </body>
</html>
