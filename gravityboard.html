<script src="./scripts/shapes/shapes.js"></script>
<script src="./scripts/gravityBoard.js"></script>
<html>

<head>
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <div id="wrapper">
        <Canvas id="field" width="300px" height="450px"></canvas>
        <div class="controls">
            <button id="add-button" class="control-button">Add Ball</button>
            <button id="remove-button" class="control-button">Remove Ball</button>
            <button id="pause-button" class="control-button">Pause</button>
            <button id="clear-button" class="control-button">Clear</button>
            <button id="gravity-button" class="control-button">Toggle Gravity</button>
            <div class="inputs">
                <div class="control-input-wrapper">
                    <span class="input-label">Canvas Width</span>
                    <input id="canvas-width" type="number">
                </div>
                <div class="control-input-wrapper">
                    <span class="input-label">Canvas Height</span>
                    <input id="canvas-height" type="number">
                </div>
            </div>
        </div>
    </div>
</body>

</html>
